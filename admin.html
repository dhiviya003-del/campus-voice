<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial;
            background-color: #f0f2f5;
        }

        .container {
            width: 80%;
            margin: auto;
            text-align: center;
        }

        .complaint-box {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            text-align: left;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Admin Panel</h1>

    <div id="complaintsContainer"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("complaints")) || [];

let container = document.getElementById("complaintsContainer");

function renderComplaints() {

    container.innerHTML = "";

    if(data.length === 0){
        container.innerHTML = "<h3>No Complaints Found</h3>";
        return;
    }

    data.forEach((c,index)=>{

        container.innerHTML += `
        <div class="complaint-box">

            <h3>Name: ${c.name}</h3>

            <p><b>Department:</b> ${c.dept}</p>

            <p><b>Category:</b> ${c.category}</p>

            <p><b>Priority:</b> ${c.priority}</p>

            <p><b>Complaint:</b> ${c.complaint}</p>

            <button onclick="deleteComplaint(${index})">
                Delete
            </button>

        </div>
        `;
    });
}

function deleteComplaint(index){

    data.splice(index,1);

    localStorage.setItem(
        "complaints",
        JSON.stringify(data)
    );

    renderComplaints();
}
