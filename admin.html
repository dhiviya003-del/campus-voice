<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial;
            background-color: #f0f2f5;
        }

        .container {
            width: 85%;
            margin: auto;
            text-align: center;
        }

        /* 🔥 DASHBOARD CARDS */
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
        }

        .card.total { border-left: 6px solid blue; }
        .card.pending { border-left: 6px solid orange; }
        .card.resolved { border-left: 6px solid green; }

        input{
            padding:10px;
            width:60%;
            margin-bottom:15px;
        }

        .complaint-box {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            text-align: left;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .resolve-btn {
            background: green;
            color: white;
            border: none;
            padding: 5px 10px;
            margin-right: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-btn {
            background: black;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <button class="logout-btn" onclick="logout()">Logout</button>

    <!-- 🔥 DASHBOARD CARDS -->
    <div class="stats">
        <div class="card total" id="total"></div>
        <div class="card pending" id="pending"></div>
        <div class="card resolved" id="resolved"></div>
    </div>

    <!-- 🔍 SEARCH -->
    <input type="text" id="search" placeholder="Search by ID or Name..." onkeyup="searchComplaint()">

    <div id="complaintsContainer"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("complaints")) || [];
let container = document.getElementById("complaintsContainer");

function renderComplaints(list = data) {

    container.innerHTML = "";

    let pendingCount = list.filter(c => c.status === "Pending").length;
    let resolvedCount = list.filter(c => c.status === "Resolved").length;

    document.getElementById("total").innerHTML =
        "Total<br>" + list.length;

    document.getElementById("pending").innerHTML =
        "Pending<br>" + pendingCount;

    document.getElementById("resolved").innerHTML =
        "Resolved<br>" + resolvedCount;

    if(list.length === 0){
        container.innerHTML = "<h3>No Complaints Found</h3>";
        return;
    }

    list.forEach((c,index)=>{

        container.innerHTML += `
        <div class="complaint-box">

            <p><b>ID:</b> ${c.id}</p>

            <h3>Name: ${c.name}</h3>

            <p><b>Department:</b> ${c.dept}</p>

            <p><b>Category:</b> ${c.category}</p>

            <p><b>Priority:</b> ${c.priority}</p>

            <p><b>Status:</b> ${c.status}</p>

            <p><b>Photo:</b> ${c.photo || "No Photo"}</p>

            <p><b>Complaint:</b> ${c.complaint}</p>

            <button class="resolve-btn" onclick="resolveComplaint(${index})">
                Resolve
            </button>

            <button class="delete-btn" onclick="deleteComplaint(${index})">
                Delete
            </button>

        </div>
        `;
    });
}

function searchComplaint(){

    let keyword = document.getElementById("search").value.toLowerCase();

    let filtered = data.filter(c =>
        c.id.toLowerCase().includes(keyword) ||
        c.name.toLowerCase().includes(keyword)
    );

    renderComplaints(filtered);
}

function resolveComplaint(index){
    data[index].status = "Resolved";
    localStorage.setItem("complaints", JSON.stringify(data));
    renderComplaints();
}

function deleteComplaint(index){
    data.splice(index,1);
    localStorage.setItem("complaints", JSON.stringify(data));
    renderComplaints();
}

function logout(){
    localStorage.removeItem("role");
    window.location.href = "Login.html";
}

renderComplaints();

</script>

</body>
</html>
