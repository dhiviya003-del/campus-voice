<!DOCTYPE html><html><head>
    <title>Complaint Form</title>
    <link rel="stylesheet" href="style.css">
</head><body><div class="container"><h1>Complaint Form</h1>

<input type="text" id="name" placeholder="Your Name">

<br><br>

<label>
    <input type="checkbox" id="anonymous">
    Submit as Anonymous
</label>

<br><br>

<input type="text" id="regno" placeholder="Register Number">

<br><br>

<input type="text" id="dept" placeholder="Department">

<br><br>

<select id="category">
    <option value="">Select Category</option>
    <option>Infrastructure</option>
    <option>Hostel</option>
    <option>Transport</option>
    <option>Canteen</option>
    <option>Library</option>
    <option>Wi-Fi/Internet</option>
    <option>Classroom Facilities</option>
    <option>Faculty Related</option>
    <option>Others</option>
</select>

<br><br>

<select id="priority">
    <option value="">Select Priority</option>
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
    <option>Critical</option>
</select>

<br><br>

<input type="file" id="photo" accept="image/*">

<br><br>

<textarea id="complaint" placeholder="Enter Your Complaint"></textarea>

<br><br>

<button onclick="submitComplaint()">Submit Complaint</button>

</div><script>

function submitComplaint() {

    let anonymous = document.getElementById("anonymous").checked;

    let name = anonymous
        ? "Anonymous"
        : document.getElementById("name").value;

    let regno = document.getElementById("regno").value;
    let dept = document.getElementById("dept").value;
    let category = document.getElementById("category").value;
    let priority = document.getElementById("priority").value;
    let complaint = document.getElementById("complaint").value;

    if(regno === "" || dept === "" || category === "" || priority === "" || complaint === "") {
        alert("Please fill all fields");
        return;
    }

    let oldData = JSON.parse(localStorage.getItem("complaints")) || [];

    let newId = "CV-" + String(oldData.length + 1).padStart(3, "0");

    let photoFile = document.getElementById("photo").files[0];
    let photoName = photoFile ? photoFile.name : "No Photo";

    let data = {
        id: newId,
        name,
        regno,
        dept,
        category,
        priority,
        complaint,
        photo: photoName,
        status: "Submitted",
        date: new Date().toLocaleDateString()
    };

    oldData.push(data);
     let notifications =
JSON.parse(localStorage.getItem("notifications")) || [];

notifications.push(
"New Complaint Submitted : " + newId
);

localStorage.setItem(
"notifications",
JSON.stringify(notifications)
);

    localStorage.setItem("complaints", JSON.stringify(oldData));

    alert("Complaint Submitted Successfully!\nComplaint ID: " + newId);

    document.getElementById("name").value = "";
    document.getElementById("regno").value = "";
    document.getElementById("dept").value = "";
    document.getElementById("category").value = "";
    document.getElementById("priority").value = "";
    document.getElementById("complaint").value = "";
    document.getElementById("photo").value = "";
    document.getElementById("anonymous").checked = false;
}

</script></body>
</html>
